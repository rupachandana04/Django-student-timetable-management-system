<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        .header {
            background: #1f4e78;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .button {
            background: #1f4e78;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #1f4e78;
            color: white;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .edit {
            color: green;
            text-decoration: none;
            margin-right: 10px;
        }

        .delete {
            color: red;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Class Timetable</h1>
        <p>Student Management System</p>
    </div>

    <div class="container">

        <div class="top-bar">
            <a href="/home/" class="button">Home</a>
            <a href="/timetable/add/" class="button">+ Add Timetable</a>
        </div>

        <table>

            <tr>
                <th>Day</th>
                <th>Subject</th>
                <th>Teacher</th>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Action</th>
            </tr>

            {% for item in timetable %}
            <tr>
                <td>{{ item.day }}</td>
                <td>{{ item.subject }}</td>
                <td>{{ item.teacher }}</td>
                <td>{{ item.start_time }}</td>
                <td>{{ item.end_time }}</td>

                <td>
                    <a class="edit"
                       href="/timetable/edit/{{ item.id }}/">
                       Edit
                    </a>

                    <a class="delete"
                       href="/timetable/delete/{{ item.id }}/"
                       onclick="return confirm('Are you sure you want to delete this timetable?');">
                       Delete
                    </a>
                </td>
            </tr>

            {% empty %}
<tr>
    <td colspan="6" style="padding: 25px; text-align: center;">
        No timetable records found.
    </td>
</tr>
{% endfor %}

        </table>

    </div>

</body>
</html>
